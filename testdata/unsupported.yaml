apiVersion: v1
kind: Service
metadata:
  name: unsupported-clusterip
  annotations:
    isim.dev/network: "macvlan"
spec:
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: unsupported-selector
  annotations:
    isim.dev/network: "macvlan"
spec:
  clusterIP: None
  selector:
    app: nginx-basic
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
