apiVersion: v1
kind: ServiceAccount
metadata:
  name: nad-service-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nad-service-controller
  labels:
    app.kubernetes.io/name: nad-service-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nad-service-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nad-service-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: nad-service-controller
      containers:
        - name: controller
          image: ko://github.com/ihcsim/nad-service-controller
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nad-service-controller
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nad-service-controller
subjects:
  - kind: ServiceAccount
    name: nad-service-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: nad-service-controller
  apiGroup: rbac.authorization.k8s.io
